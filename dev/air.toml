root = "."
tmp_dir = "build/dev"

[build]
cmd = "go build -race -o ./build/dev/seonaut ./cmd/server"
bin = "./build/dev/seonaut"
args_bin = ["-c", "config.local"]
delay = 500
include_ext = ["go", "html", "json", "yaml", "yml", "toml", "local"]
include_file = ["go.mod", "go.sum", "config.local"]
exclude_dir = [".git", "archive", "build", "node_modules", "web/static"]
exclude_regex = ["_test.go"]
exclude_unchanged = true
poll = true
poll_interval = 1000
send_interrupt = true
kill_delay = "1s"
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = false
