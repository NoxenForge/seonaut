services:
  db:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${SEONAUT_DEV_ROOT_PASSWORD:?Run ./dev.sh init first}
      MYSQL_DATABASE: seonaut
      MYSQL_USER: seonaut
      MYSQL_PASSWORD: ${SEONAUT_DEV_DB_PASSWORD:?Run ./dev.sh init first}
    ports:
      - "127.0.0.1:${SEONAUT_DEV_DB_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: localhost/seonaut-dev-tools:local
    build:
      context: .
      dockerfile: dev/Containerfile
    working_dir: /app
    environment:
      CGO_ENABLED: "1"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${SEONAUT_DEV_PORT:-9001}:9000"
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      assets:
        condition: service_started

  assets:
    image: localhost/seonaut-dev-tools:local
    working_dir: /app
    volumes:
      - .:/app
    command:
      - esbuild
      - ./web/css/style.css
      - --bundle
      - --outdir=./web/static
      - --public-path=/resources
      - --loader:.woff=file
      - --loader:.woff2=file
      - --loader:.png=file
      - --watch=forever

volumes:
  mysql-data:
  go-modules:
  go-build:
